      operationId: rejectOrder
      x-owner-task: BE-08
      summary: 卖家拒绝订单
      description: 仅卖家；订单须为 `PENDING_CONFIRMATION`；原因必填。转为 `REJECTED`，释放商品回 `ON_SALE`，写事件并通知买家。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
