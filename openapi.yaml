  # ---------------------------------------------------------------------------
  # 8.8 订单 API
  # ---------------------------------------------------------------------------
  /orders:
    post:
      tags: [order]
      operationId: createOrder
      x-owner-task: BE-08
      summary: 创建订单
      description: |
        要求买家 `ACTIVE` 且 `APPROVED`。以「当前用户 + `clientRequestId`」为幂等键：
        首次创建返回 **201**；同键且 `itemId`、`tradeMode` 与原订单一致的重放返回 **200**，业务数据以原订单快照为准；
        同键但内容不一致返回 `ORDER_DUPLICATE_REQUEST`。
        并发下商品已被锁定返回 `ITEM_CONCURRENTLY_RESERVED`；购买自己的商品返回 `ITEM_SELF_PURCHASE`；商品不可购买返回 `ITEM_NOT_AVAILABLE`。
        MVP 只接受 `OFFLINE`。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 首次创建成功，返回新订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '200':
          description: 幂等重放，返回已存在的原订单（内容与首次请求一致）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /orders/{id}:
    get:
      tags: [order]
      operationId: getOrderDetail
      x-owner-task: BE-08
      summary: 获取订单详情
      description: 仅买家或卖家可见，否则 `ORDER_OPERATION_FORBIDDEN`；管理员不是订单的天然参与方，同样需要是买家或卖家才可见（管理端的全量订单视图走管理端接口）。使用下单时的不可变快照字段，返回事件时间线与 `allowedActions`。前端按 `allowedActions` 展示按钮，后端每次仍重新校验。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /orders/{id}/confirm:
    post:
      tags: [order]
      operationId: confirmOrder
      x-owner-task: BE-08
      summary: 卖家接单
      description: 仅卖家；订单须为 `PENDING_CONFIRMATION` 且商品为 `RESERVED`。转为 `CONFIRMED`，记录 `confirmedAt` 与事件，提交后通知买家。
      security: [{bearerAuth: []}]
