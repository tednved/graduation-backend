  /orders/{id}/cancel:
    post:
      tags: [order]
      operationId: cancelOrder
      x-owner-task: BE-08
      summary: 取消订单
      description: |
        `PENDING_CONFIRMATION` 仅买家可取消；`CONFIRMED` 买家或卖家均可取消；原因必填。
        `PENDING_RECEIPT` 不允许普通用户取消（返回 `ORDER_ILLEGAL_STATUS_TRANSITION`）。
        转为 `CANCELLED`，释放商品回 `ON_SALE`，通知另一方。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderReasonRequest'
      responses:
        '200':
          description: 更新后的订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /orders/{id}/deliver:
    post:
      tags: [order]
      operationId: deliverOrder
      x-owner-task: BE-08
      summary: 卖家确认交付
      description: 仅卖家；订单须为 `CONFIRMED`。转为 `PENDING_RECEIPT`，记录 `deliveredAt`，写事件并通知买家。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 更新后的订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /orders/{id}/receive:
    post:
      tags: [order]
      operationId: receiveOrder
      x-owner-task: BE-08
      summary: 买家确认收货
      description: 仅买家；订单须为 `PENDING_RECEIPT`。订单转 `COMPLETED` 且商品转 `SOLD`，记录 `completedAt` 与事件，向双方创建可评价通知。订单与商品在同一事务内提交。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 更新后的订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /users/me/orders:
    get:
      tags: [order]
      operationId: listMyOrders
      x-owner-task: BE-08
      summary: 我的订单（买入 / 卖出）
      description: |
        `side` 是同一路径上的枚举：`BUY` 返回当前用户作为买家的订单，`SELL` 返回作为卖家的订单。
        可按订单状态筛选，按下单时间倒序分页。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: side
