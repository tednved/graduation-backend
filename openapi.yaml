openapi: 3.1.0

info:
  title: 校园二手物品交易系统 API
  version: 1.0.0
  description: |
    本文件是 MVP 全部 HTTP 接口的唯一契约（Task-ID: API-01），依据总纲 v2.6 §3/§4/§7/§8 生成。
    实现任务与契约不一致时，先修订本文件与总纲，再改实现。

    通用约定：
    - 基础路径 `/api/v1` 由 `servers` 提供，paths 中不重复该前缀；
    - 除 `POST /auth/wechat-login`、`POST /auth/refresh` 与标注为公开的接口外，所有操作要求 Bearer Token；
    - 成功响应统一包裹 `ApiResponse`，失败响应统一包裹 `ApiError`，HTTP 状态与错误码的映射见总纲 §7.2；
    - ID（含嵌套 ID 与 bizId）一律为十进制字符串；金额与平均分为两位小数字符串；时间为 UTC ISO 8601 毫秒；
    - 返回 204 的操作没有响应体；
    - 每个操作的 `x-owner-task` 声明实现它的任务 ID。

servers:
  - url: /api/v1
    description: 应用基础路径

tags:
  - name: auth
    description: 微信登录、令牌刷新与退出
  - name: user
    description: 当前用户资料与公开资料
  - name: certification
    description: 校园认证申请与审核
  - name: category
    description: 分类树与分类管理
  - name: file
    description: 文件上传
  - name: item
    description: 商品发布、编辑、上下架与搜索
  - name: favorite
    description: 商品收藏
  - name: order
    description: 订单状态机与买卖列表
  - name: review
    description: 订单评价与用户信用
  - name: notification
    description: 站内业务通知
  - name: admin
    description: 管理端用户、商品与审计查询

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # 8.1 认证 API
  # ---------------------------------------------------------------------------
  /auth/wechat-login:
    post:
      tags: [auth]
      operationId: wechatLogin
      x-owner-task: BE-04
      summary: 微信小程序登录
      description: |
        用微信 `code` 换取会话并换取本系统令牌。首次登录按 openid 创建默认 `USER`/`ACTIVE` 用户。
        微信侧失败统一映射为 `AUTH_INVALID_CODE`，不返回微信原始错误与敏感信息；`session_key` 使用后立即丢弃，不落库、不返回。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: 登录成功，返回令牌与当前用户摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      x-owner-task: BE-04
      summary: 刷新令牌
      description: |
        用 Refresh Token 换取新的令牌对，并轮换（撤销旧 Token、写入 `replacedByTokenId`）。
        校验未过期、未撤销、设备一致、用户 `ACTIVE`；任一不满足返回 `AUTH_REFRESH_INVALID`。
        检测到已撤销 Token 被再次使用时，撤销该用户该设备的全部 Refresh Token。
        本接口不参与前端的 401 自动刷新队列。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 轮换成功，返回新的令牌对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      x-owner-task: BE-04
      summary: 退出登录
      description: 撤销传入的 Refresh Token。Token 已撤销或不存在也返回 204，保证幂等。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: 已撤销（或本就无效），无响应体
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'

  # ---------------------------------------------------------------------------
  # 8.2 用户 API
  # ---------------------------------------------------------------------------
  /users/me:
    get:
      tags: [user]
      operationId: getMyProfile
      x-owner-task: BE-04
      summary: 获取当前用户资料
      description: 当前用户信息的唯一入口，不再提供 `/auth/me`。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    patch:
      tags: [user]
      operationId: updateMyProfile
      x-owner-task: BE-04
      summary: 修改当前用户资料
      description: |
        局部更新：请求体中**省略**的字段保持原值；`phone`/`avatarFileId` 显式 `null` 表示清除；
        `nickname` 显式 `null` 非法（返回 `VALIDATION_ERROR`）。昵称首尾空格由服务端清理后保存。
        系统固定使用 `MAIN` 默认校区，不接受校区字段；`avatarFileId` 必须是当前用户所有、`bizType=AVATAR`、状态 `UPLOADED` 的文件。
        请求中出现 `role`、`status`、`openid`、评分字段一律非法。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /users/{userId}/public:
    get:
      tags: [user]
      operationId: getPublicUser
      x-owner-task: BE-04
      summary: 获取用户公开资料
      description: |
        只返回脱敏字段，任何情况下都不返回 `openid`、`unionid`、手机号与认证证据信息。
        `DISABLED` 用户的历史评价仍可查看，但 `accountActive=false`。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 公开资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicUser'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  # ---------------------------------------------------------------------------
  # 8.3 校园认证 API
  # ---------------------------------------------------------------------------
  /certifications:
    post:
      tags: [certification]
      operationId: submitCertification
      x-owner-task: BE-05
      summary: 提交校园认证申请
      description: |
        要求当前用户 `ACTIVE`；已存在 `PENDING` 申请时返回 `CERTIFICATION_PENDING_EXISTS`（并发下由 `SELECT ... FOR UPDATE` 保证）。
        系统固定使用 `MAIN` 默认校区；MVP 仅接受 `MANUAL` 认证，不接收证据文件。
        `realName`、`studentNo` 的脱敏展示值由服务端生成，请求中不得出现脱敏字段。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitCertificationRequest'
      responses:
        '201':
          description: 申请已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /certifications/me/latest:
    get:
      tags: [certification]
      operationId: getMyLatestCertification
      x-owner-task: BE-05
      summary: 获取本人最新认证申请
      description: |
        从未提交过申请时返回 200，`data.status = NOT_SUBMITTED`，其余申请字段为 `null`（不使用 404）。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 最新申请；从未申请时为 `NOT_SUBMITTED`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CertificationLatest'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/certifications:
    get:
      tags: [certification]
      operationId: listCertifications
      x-owner-task: BE-05
      summary: 分页查询认证申请（管理员）
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          description: 按认证状态筛选，省略表示全部
          schema:
            $ref: '#/components/schemas/CertificationStatus'
      responses:
        '200':
          description: 申请分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/certifications/{id}/approve:
    post:
      tags: [certification]
      operationId: approveCertification
      x-owner-task: BE-05
      summary: 通过认证申请（管理员）
      description: 锁定读取 `PENDING` 申请；置 `APPROVED`，写审核人与时间，同步用户认证状态，写审计。重复审核返回 `CERTIFICATION_ALREADY_REVIEWED`。不能审核自己提交的申请（`AUTH_FORBIDDEN`）。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CertificationId'
      responses:
        '200':
          description: 审核后的申请
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Certification'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/certifications/{id}/reject:
    post:
      tags: [certification]
      operationId: rejectCertification
      x-owner-task: BE-05
      summary: 驳回认证申请（管理员）
      description: 与通过相同的前置与副作用（含不能审核自己提交的申请），但必须提供 2～200 字原因，用户认证状态同步为 `REJECTED`。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CertificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCertificationRequest'
      responses:
        '200':
          description: 审核后的申请
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  # ---------------------------------------------------------------------------
  # 8.4 分类 API
  # ---------------------------------------------------------------------------
  /categories/tree:
    get:
      tags: [category]
      operationId: getCategoryTree
      x-owner-task: BE-05
      summary: 获取启用的两级分类树
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 两级分类树，只含 `ENABLED` 节点
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CategoryTree'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/categories:
    post:
      tags: [category]
      operationId: createCategory
      x-owner-task: BE-05
      summary: 创建分类（管理员）
      description: 同级名称唯一；`parentId` 非空时父分类必须是一级且 `ENABLED`。写审计。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: 已创建的分类
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/categories/{id}:
    patch:
      tags: [category]
      operationId: updateCategory
      x-owner-task: BE-05
      summary: 修改分类（管理员）
      description: 省略字段保持原值；不允许通过本接口改变父子层级。同级名称仍需唯一。写审计。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: 更新后的分类
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/categories/{id}/enable:
    post:
      tags: [category]
      operationId: enableCategory
      x-owner-task: BE-05
      summary: 启用分类（管理员）
      description: 启用自身；若为一级分类，同时启用其下已停用的子分类。写审计。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: 启用后的分类
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'

  /admin/categories/{id}/disable:
    post:
      tags: [category]
      operationId: disableCategory
      x-owner-task: BE-05
      summary: 停用分类（管理员）
      description: 自身或子分类存在 `ON_SALE`/`RESERVED` 商品时返回 `CATEGORY_IN_USE`。停用一级分类时，同时停用其下没有在售商品的子分类。写审计。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: 停用后的分类
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'

  # ---------------------------------------------------------------------------
  # 8.5 文件 API
  # ---------------------------------------------------------------------------
  /files:
    post:
      tags: [file]
      operationId: uploadFile
      x-owner-task: BE-05
      summary: 上传文件
      description: |
        `multipart/form-data`，文件字段名固定为 `file`。按 `FilePolicy` 校验 MIME、扩展名、文件头与大小，
        计算 SHA-256，生成不可猜测的 objectKey 并写入对象存储，保存 `UPLOADED` 元数据。
        对象写入成功但数据库失败时立即补偿删除对象。商品图片和头像返回公开稳定 URL；当前 MVP 不开放认证证据上传。返回 `fileId` 与可访问 URL，不返回内部 objectKey。
        商品图片只接受本接口返回的 `fileId`，禁止前端提交最终 URL。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: bizType
          in: query
          required: true
          description: 文件业务类型。ITEM_IMAGE 最大 5 MB，AVATAR 最大 2 MB；仅 JPEG/PNG/WebP。当前 MVP 不接受 CERTIFICATION_EVIDENCE
          schema:
            type: string
            enum: [ITEM_IMAGE, AVATAR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件内容，字段名固定为 `file`
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/FileObject'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
