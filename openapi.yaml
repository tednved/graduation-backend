  # ---------------------------------------------------------------------------
  # 8.9 评价 API
  # ---------------------------------------------------------------------------
  /reviews:
    post:
      tags: [review]
      operationId: createReview
      x-owner-task: BE-09
      summary: 创建评价
      description: |
        订单必须为 `COMPLETED`，当前用户必须是买家或卖家，`reviewee` 由系统按对端计算。
        同一订单同一评价人只能有一条评价，重复返回 `REVIEW_ALREADY_EXISTS`。
        创建后重新聚合被评价人的平均分与评价数并写回用户，向被评价人创建 `REVIEW_RECEIVED` 通知。
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
