          required: true
          description: 买卖视角，必填
          schema:
            $ref: '#/components/schemas/OrderSide'
        - name: status
          in: query
          required: false
          description: 省略表示全部状态
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 订单分页
          content:
            application/json:
              schema:
                allOf:
