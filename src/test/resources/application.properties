# 测试专用配置：覆盖 src/main/resources/application.properties。
# 凭据解析顺序与 DB-01 保持一致：-D 系统属性 > 环境变量，仓库内不保存任何口令。
db.it.username=${DB_IT_USERNAME:}
db.it.password=${DB_IT_PASSWORD:}

# 目标 schema 名必须以 _it 结尾：RealMySqlTestConfiguration 会在 clean() 之前校验。
spring.datasource.url=${DB_IT_URL:jdbc:mysql://127.0.0.1:3306/graduation_mvp_it?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${db.it.username}
spring.datasource.password=${db.it.password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 测试要重置一次性 schema，因此必须允许 clean；生产配置保持 clean-disabled=true。
spring.flyway.clean-disabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=true

app.wechat.mode=mock
app.wechat.mock-openid=
app.file.storage-root=${java.io.tmpdir}/graduation-it-media
app.file.public-base-url=/media
