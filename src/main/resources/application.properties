spring.application.name=backend

# ---------------------------------------------------------------------------
# 本地演示环境：固定开发库账号，保证 IDE 直接运行；仅用于本机开发
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/graduation-project?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=tednved
spring.datasource.password=0721

# ---------------------------------------------------------------------------
# 表结构由 Flyway 独占管理，Hibernate 只校验，绝不建表或改表
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------------
# 上传与序列化
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------------------------------------------------------------------------
# 业务配置
# ---------------------------------------------------------------------------
app.jwt.secret=graduation-project-local-dev-jwt-secret-2026
app.wechat.mode=mock
app.wechat.mock-openid=mock_6642887b44a05327ae8f7630
app.file.storage-root=${FILE_STORAGE_ROOT:./var/media}
app.file.public-base-url=/media
